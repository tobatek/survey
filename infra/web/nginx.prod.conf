# Nginx untuk apps/web (SPA Vue + vue-router). Semua path yang bukan file
# statis nyata diarahkan ke index.html supaya client-side routing jalan
# (refresh di /dashboard/xyz tidak 404).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset hasil build Vite sudah punya hash di nama file -- aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
