# Nginx untuk apps/api (Laravel) production -- jalan satu container
# bersama PHP-FPM (lihat infra/php/supervisord.conf), bukan container
# terpisah seperti di dev (infra/nginx/default.conf), supaya nginx punya
# akses filesystem langsung ke public/ tanpa volume share lintas-container.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 25m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
