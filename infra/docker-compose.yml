# Docker Compose lokal — Fase 0 (docs/16_PLAN_FULLSTACK_LARAVEL_MYAMETA_SURVEY.md).
# Meniru arsitektur deployment satu server tanpa load balancer (FSD §3-4):
# Nginx + PHP-FPM + PostgreSQL + Redis + queue worker + scheduler.
#
# Belum dijalankan otomatis — jalankan manual setelah Docker Desktop terpasang:
#   cd infra && docker compose up -d
#
# Lalu (sekali, dari host atau exec ke container app):
#   docker compose exec app php artisan migrate
#   docker compose exec app php artisan key:generate

services:
  app:
    build:
      context: ../apps/api
      dockerfile: ../../infra/php/Dockerfile
    volumes:
      - ../apps/api:/var/www/html
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myameta

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ../apps/api:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - myameta

  queue:
    build:
      context: ../apps/api
      dockerfile: ../../infra/php/Dockerfile
    command: php artisan queue:work --tries=3 --backoff=5 --sleep=1
    volumes:
      - ../apps/api:/var/www/html
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myameta

  scheduler:
    build:
      context: ../apps/api
      dockerfile: ../../infra/php/Dockerfile
    # FSD §18.3: aktivasi/penutupan campaign due, reminder, sync, cleanup.
    # withoutOverlapping() di sisi Laravel mencegah eksekusi dobel bila
    # container di-restart di tengah jadwal.
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ../apps/api:/var/www/html
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myameta

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=myameta_survey
      - POSTGRES_USER=myameta
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myameta -d myameta_survey"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - myameta

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - myameta

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../apps/web:/app
    ports:
      - "5173:5173"
    networks:
      - myameta

networks:
  myameta:
    driver: bridge

volumes:
  postgres_data:
